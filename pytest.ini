# v2.9: scope the bare root-level `pytest` run to the harness suite.
#
# Without this, running `pytest` at the workspace root collected *everything*,
# including the generated projects under projects/. That is how
# tests/test_providers.py and projects/logtriage/tests/test_providers.py ended
# up as the same module basename in one collection: neither directory has an
# __init__.py, so pytest's prepend import mode filed both as top-level
# `test_providers` and refused to import the second one. The core suite became
# uncollectable whenever a stale __pycache__ was lying around.
#
# Generated projects are still tested directly, which is how the harness has
# always done it and still does:
#   python -m pytest            (this file: the harness suite)
#   python -m pytest --rootdir=projects/logtriage   (one project)
# Each project's own tests/conftest.py puts its root on sys.path.
[pytest]
testpaths = tests
